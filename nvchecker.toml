#[brave-browser]
#source = "github"
#github = "brave/brave-browser"
#use_max_tag = true

[brave-browser-beta]
source = "cmd"
cmd = "curl -fsSL -H \"Authorization: Bearer $NVCHECKER_GITHUB_TOKEN\" \"https://api.github.com/repos/brave/brave-browser/releases?per_page=20\" | jq -r '[.[] | select(.name != null and (.name | test(\"^Beta v[0-9]+[.][0-9]*[02468]\")))] | first | .tag_name | ltrimstr(\"v\")'"
include_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"

[brave-origin-beta]
source = "regex"
url = "https://versions.brave.com/latest/brave-versions.json"
regex = '"name":"([0-9]+\.[0-9]+\.[0-9]+)","channel":"beta"'

#[ff-dev-edition]
#source = "github"
#github = "itachi-re/ff-dev-obs"
#use_max_tag = true

[firedragon]
source = "git"
git = "https://gitlab.com/garuda-linux/firedragon/firedragon13.git"
use_latest_release = true

[floorp]
source = "git"
git = "https://github.com/Floorp-Projects/Floorp.git"
use_max_release = true

[helium-browser]
source = "git"
git = "https://github.com/imputnet/helium-linux.git"
include_regex = '^\d+(\.\d+)+$'

[vivaldi]
source = "cmd"
cmd = "curl -fsSL https://repo.vivaldi.com/archive/deb/dists/stable/main/binary-amd64/Packages.gz | gzip -dc | awk '/^Package: vivaldi-stable$/{f=1;next} f && /^Version: /{print $2; f=0}' | cut -d- -f1 | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -n1"
include_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"

[zen-browser]
source = "git"
git = "https://github.com/zen-browser/desktop.git"
use_max_release = true


