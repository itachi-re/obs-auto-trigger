source = "github"
github = "benapetr/TuxManager"
use_commit = true


# ══════════════════════════════════════════════════════════════════════════════
# System utilities
# ══════════════════════════════════════════════════════════════════════════════

[input-remapper]
source = "github"
github = "sezanzeb/input-remapper"
use_latest_release = true

[win11-clipboard-history]
source = "github"
github = "gustavosett/Windows-11-Clipboard-History-For-Linux"
use_max_tag = true


# ══════════════════════════════════════════════════════════════════════════════
# Torrents / P2P
# ══════════════════════════════════════════════════════════════════════════════

["nicotine+"]
source = "git"
git = "https://github.com/nicotine-plus/nicotine-plus.git"
use_max_tag = true

[qBittorrent-Enhanced-Edition]
source = "github"
github = "c0re100/qBittorrent-Enhanced-Edition"
use_latest_release = true


# ══════════════════════════════════════════════════════════════════════════════
# Wine / Proton / Emulation
# ══════════════════════════════════════════════════════════════════════════════

[Bottles]
source = "git"
git = "https://github.com/bottlesdevs/Bottles.git"
use_max_tag = true

[faugus-launcher]
source = "github"
github = "Faugus/faugus-launcher"
use_max_tag = true

[ProtonPlus]
source = "git"
git = "https://github.com/Vysp3r/ProtonPlus.git"
use_max_release = true

[protonup-qt]
source = "github"
github = "DavidoTek/ProtonUp-Qt"
use_max_tag = true

[shadps4]
source = "git"
git = "https://github.com/shadps4-emu/shadPS4.git"
include_regex = "^v\\.\\d+(\\.\\d+)*$"
prefix = "v."

[winboat]
source = "github"
github = "TibixDev/winboat"
use_max_tag = true

[windows95]
source = "github"
github = "felixrieseberg/windows95"
use_max_tag = true
