name: Check Upstream Versions & Trigger OBS

on:
  push:
    branches:
      - main
    paths:
      - 'nvchecker.toml'
      - 'scripts/**'
      - '.github/workflows/**'
  schedule:
    # Runs every 6 hours (cron syntax: min hour day month weekday)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — check versions only, do NOT trigger OBS or commit'
        required: false
        default: false
        type: boolean
      force_package:
        description: 'Force-trigger a specific package name (leave empty to check all)'
        required: false
        default: ''
        type: string

# ── Concurrency guard ────────────────────────────────────────────────────────
# Prevents two runs from overlapping and racing on the git push.
# cancel-in-progress: false lets the running job finish; new runs queue behind it.
concurrency:
  group: obs-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit versions.json back to the repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OBS_PROJECT:     ${{ vars.OBS_PROJECT || 'home:itachi_re' }}
  VERSIONS_OLD:    versions.json
  VERSIONS_NEW:    versions_new.json
  # Must match `keyfile = ...` in nvchecker.toml [__config__]. Generated at
  # runtime from a secret and NEVER committed (add it to .gitignore).
  KEYFILE:         .nvchecker_keyfile.toml
  PYTHON_VERSION:  '3.12'
  # Fail the run (and skip OBS triggers) if more than this fraction of the
  # entries in nvchecker.toml errored. Below it, the run continues with the
  # entries that did succeed and errored ones are retried next run.
  MAX_ERROR_RATIO: '0.25'

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 3. Install dependencies ──────────────────────────────────────────
      # `requests` is kept for trigger_obs.py. The jq *CLI* (used by the
      # brave-browser-beta `cmd` source) is preinstalled on ubuntu-latest, so
      # the apt install and the PyPI `jq` package are no longer needed.
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install 'nvchecker[all]' requests

      - name: Verify tools
        run: |
          nvchecker --version
          jq --version

      # ── 4. Validate required secrets ─────────────────────────────────────
      # Secrets go through env vars — embedding them in shell expressions
      # would print them in the expanded command log.
      - name: Validate required secrets
        env:
          _OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${_OBS_TOKEN}" ]; then
            echo "::error::OBS_TOKEN secret is not set. See README.md for instructions on creating an OBS token."
            exit 1
          fi
          echo "✅ All required secrets are present."

      # ── 5. Bootstrap versions.json on first run ───────────────────────────
      - name: Bootstrap versions.json if missing
        run: |
          set -euo pipefail
          if [ ! -f "$VERSIONS_OLD" ]; then
            echo "{}" > "$VERSIONS_OLD"
            echo "ℹ️  Created empty $VERSIONS_OLD (first run)."
          fi

      # ── 6. Check GitHub API auth / rate limit ─────────────────────────────
      # Fails fast on a bad/expired token (HTTP 401) and warns when the
      # GraphQL budget (used by nvchecker's github source) is nearly gone.
      - name: Check GitHub API auth and rate limit
        env:
          GH_TOKEN: ${{ secrets.NVCHECKER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/rate_limit)
          echo "$resp" | jq -r '.resources | "core: \(.core.remaining)/\(.core.limit)   graphql: \(.graphql.remaining)/\(.graphql.limit)"'
          remaining=$(echo "$resp" | jq -r '.resources.graphql.remaining')
          if [ "$remaining" -lt 100 ]; then
            echo "::warning::Low GitHub GraphQL rate limit: ${remaining} requests left"
          fi

      # ── 7. Write nvchecker keyfile ────────────────────────────────────────
      # nvchecker reads API tokens from a keyfile, not from environment
      # variables. Without it every github-source lookup is unauthenticated.
      - name: Write nvchecker keyfile
        env:
          GH_TOKEN: ${{ secrets.NVCHECKER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf '[keys]\ngithub = "%s"\n' "${GH_TOKEN}" > "$KEYFILE"
          echo "✅ Wrote $KEYFILE"

      # ── 8. Run nvchecker ──────────────────────────────────────────────────
      # Paths (oldver/newver/keyfile) live in nvchecker.toml [__config__].
      # nvchecker may exit non-zero on partial errors, so errexit is disabled
      # around it; the "Analyze" step below decides whether the run is usable.
      # NVCHECKER_GITHUB_TOKEN is still exported because the brave-browser-beta
      # `cmd` source reads $NVCHECKER_GITHUB_TOKEN from its shell environment.
      - name: Run nvchecker
        id: nvchecker
        env:
          NVCHECKER_GITHUB_TOKEN: ${{ secrets.NVCHECKER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          rm -f "$VERSIONS_NEW"
          echo "Running nvchecker against nvchecker.toml …"

          set +e
          nvchecker -c nvchecker.toml --logger json \
            2>nvchecker_errors.log | tee nvchecker_output.jsonl
          rc=${PIPESTATUS[0]}
          set -e
          echo "nvchecker exit code: ${rc}"

          if [ -s nvchecker_errors.log ]; then
            echo "::group::nvchecker stderr"
            cat nvchecker_errors.log
            echo "::endgroup::"
          fi

          # Record whether nvchecker really wrote a result file, then make sure
          # downstream steps always have a valid VERSIONS_NEW to read.
          if [ -f "$VERSIONS_NEW" ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
            echo "::warning::nvchecker produced no $VERSIONS_NEW — using old versions as baseline."
            cp "$VERSIONS_OLD" "$VERSIONS_NEW"
          fi

      # ── 9. Analyze nvchecker results ──────────────────────────────────────
      # Surfaces per-package errors (rate limits, bad config, upstream down)
      # as annotations + job summary instead of letting them pass silently,
      # and stops the run before any OBS trigger if the result is mostly junk.
      - name: Analyze nvchecker results
        env:
          NV_PRODUCED: ${{ steps.nvchecker.outputs.produced }}
        run: |
          python - <<'EOF'
          import json, os, re, sys, tomllib

          with open("nvchecker.toml", "rb") as f:
              cfg = tomllib.load(f)
          total = sum(1 for k in cfg if k != "__config__")

          errors = {}
          for path in ("nvchecker_output.jsonl", "nvchecker_errors.log"):
              if not os.path.exists(path):
                  continue
              with open(path, errors="replace") as f:
                  for line in f:
                      line = line.strip()
                      if not line.startswith("{"):
                          continue
                      try:
                          rec = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if not isinstance(rec, dict):
                          continue
                      if str(rec.get("level", "")).lower() not in {"error", "critical", "exception"}:
                          continue
                      name = str(rec.get("name") or "(global)")
                      msg = str(rec.get("event") or "").strip().replace("\n", " ")
                      # nvchecker logs the useful part in "error"; "event" is
                      # often just "unexpected error happened".
                      err = str(rec.get("error") or "").strip().replace("\n", " ")
                      m = re.match(r"HTTPError\((\d+)", err)
                      if m:
                          u = re.search(r"effective_url='([^']+)'", err)
                          err = f"HTTP {m.group(1)}" + (f" {u.group(1)}" if u else "")
                      if err and err not in msg:
                          msg = f"{msg} — {err}" if msg else err
                      errors.setdefault(name, msg[:300])

          produced = os.environ.get("NV_PRODUCED") == "true"
          max_ratio = float(os.environ.get("MAX_ERROR_RATIO", "0.25"))
          ratio = (len(errors) / total) if total else 0.0

          print(f"Entries in nvchecker.toml : {total}")
          print(f"Entries with errors       : {len(errors)} ({ratio:.0%})")
          for name, msg in sorted(errors.items()):
              print(f"  ✗ {name}: {msg}")
          for name, msg in sorted(errors.items())[:10]:
              print(f"::warning title=nvchecker: {name}::{msg}")

          ghs = os.environ.get("GITHUB_STEP_SUMMARY")
          if ghs:
              with open(ghs, "a") as f:
                  f.write("## nvchecker\n\n")
                  f.write(f"Checked **{total}** entries — **{len(errors)}** errored ({ratio:.0%}).\n\n")
                  if errors:
                      f.write("| Package | Error |\n|---------|-------|\n")
                      for name, msg in sorted(errors.items()):
                          safe = msg.replace("|", "\\|")
                          f.write(f"| `{name}` | {safe} |\n")
                      f.write("\n")

          if not produced:
              print("::error::nvchecker did not produce a versions file.")
              sys.exit(1)
          if ratio > max_ratio:
              print(f"::error::{ratio:.0%} of entries errored (limit {max_ratio:.0%}) — "
                    "not triggering OBS. Check the errors above (rate limit / token?).")
              sys.exit(1)
          EOF

      # ── 10. Show human-readable version diff ──────────────────────────────
      - name: Show version diff
        run: |
          python - <<'EOF'
          import json, os, sys

          def load(path):
              try:
                  with open(path) as f:
                      raw = json.load(f)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}
              # Unwrap nvchecker v2 envelope: {"version": 2, "data": {...}}
              if isinstance(raw.get("version"), int) and isinstance(raw.get("data"), dict):
                  raw = raw["data"]
              return {
                  k: (v.get("version", str(v)) if isinstance(v, dict) else str(v))
                  for k, v in raw.items()
              }

          old = load(os.environ["VERSIONS_OLD"])
          new = load(os.environ["VERSIONS_NEW"])

          print("=== Version diff (old → new) ===")
          changed = {k: (old.get(k, "(new)"), new[k]) for k in new if old.get(k) != new[k]}
          if not changed:
              print("  (no version changes detected)")
              sys.exit(0)

          col = max(len(k) for k in changed) + 2
          for pkg, (prev, curr) in sorted(changed.items()):
              print(f"  {pkg:<{col}} {prev}  →  {curr}")
          EOF

      # ── 11a. Force-trigger a single package (optional) ────────────────────
      # DRY_RUN is passed via env — trigger_obs.py reads os.environ["DRY_RUN"].
      - name: Force-trigger specific package
        id: force
        if: ${{ github.event.inputs.force_package != '' }}
        env:
          OBS_TOKEN:     ${{ secrets.OBS_TOKEN }}
          FORCE_PACKAGE: ${{ github.event.inputs.force_package }}
          DRY_RUN:       ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          python scripts/trigger_obs.py \
            --force-package "$FORCE_PACKAGE"

      # ── 11b. Trigger OBS for all updated packages ─────────────────────────
      - name: Trigger OBS service runs for updated packages
        id: trigger
        if: ${{ github.event.inputs.force_package == '' }}
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
          DRY_RUN:   ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          python scripts/trigger_obs.py \
            --old-versions "$VERSIONS_OLD" \
            --new-versions "$VERSIONS_NEW" \
            --output-summary trigger_summary.json

      # ── 12. Print summary to log AND the Actions summary page ─────────────
      - name: Print trigger summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f trigger_summary.json ]; then
            echo "No trigger_summary.json produced — skipping summary."
            exit 0
          fi

          python - <<'EOF'
          import json, os

          with open("trigger_summary.json") as f:
              s = json.load(f)

          print("=== Trigger Summary ===")
          print(f"  Packages checked  : {s.get('checked', 0)}")
          print(f"  Updates found     : {s.get('updated', 0)}")
          print(f"  OBS triggers sent : {s.get('triggered', 0)}")
          print(f"  Failures          : {s.get('failed', 0)}")

          if s.get("updated_list"):
              print("\nUpdated packages:")
              for p in s["updated_list"]:
                  print(f"  {p['package']}: {p['old']} → {p['new']} [{p['status']}]")

          if s.get("failed_list"):
              print("\nFailed packages:")
              for p in s["failed_list"]:
                  print(f"  {p['package']}: {p['error']}")

          md = ["## OBS Trigger Summary\n"]
          md += [
              "| Metric | Value |",
              "|--------|------:|",
              f"| Packages checked  | {s.get('checked', 0)} |",
              f"| Updates found     | {s.get('updated', 0)} |",
              f"| OBS triggers sent | {s.get('triggered', 0)} |",
              f"| Failures          | {s.get('failed', 0)} |",
          ]

          if s.get("updated_list"):
              md += [
                  "\n### Updated packages",
                  "| Package | Old | New | Status |",
                  "|---------|-----|-----|--------|",
              ]
              for p in s["updated_list"]:
                  md.append(f"| `{p['package']}` | `{p['old']}` | `{p['new']}` | {p['status']} |")

          if s.get("failed_list"):
              md += [
                  "\n### Failed packages",
                  "| Package | Error |",
                  "|---------|-------|",
              ]
              for p in s["failed_list"]:
                  md.append(f"| `{p['package']}` | {p['error']} |")

          ghs = os.environ.get("GITHUB_STEP_SUMMARY")
          if ghs:
              with open(ghs, "a") as f:
                  f.write("\n".join(md) + "\n")
          EOF

      # ── 13. Commit updated versions.json ──────────────────────────────────
      # Runs after failures too (!cancelled instead of always, so a manual
      # cancel doesn't commit), which is what lets successfully-triggered
      # packages advance even when another package failed.
      #
      # Safety rules:
      #   - Skipped for dry runs and for force-trigger runs (a force run
      #     triggers one package; it must not mark every other pending update
      #     as "known" without having triggered it).
      #   - If the trigger step never completed AND left no summary (crash,
      #     bad OBS token, or nvchecker analysis aborted the run), NOTHING is
      #     advanced, so every update is retried next run instead of lost.
      #   - Packages in failed_list keep their old version → retried next run.
      - name: Commit updated versions.json
        if: ${{ !cancelled() && (github.event.inputs.dry_run || 'false') != 'true' && github.event.inputs.force_package == '' }}
        env:
          TRIGGER_OUTCOME: ${{ steps.trigger.outcome }}
        run: |
          set -euo pipefail

          python - <<'EOF'
          import json, os, sys

          def load_flat(path):
              """Load a versions file and return a flat {pkg: version_str} dict."""
              try:
                  with open(path) as f:
                      raw = json.load(f)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}
              if isinstance(raw.get("version"), int) and isinstance(raw.get("data"), dict):
                  raw = raw["data"]
              return {
                  k: (v.get("version", str(v)) if isinstance(v, dict) else str(v))
                  for k, v in raw.items()
              }

          def load_json(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}

          summary_exists = os.path.exists("trigger_summary.json")
          if not summary_exists and os.environ.get("TRIGGER_OUTCOME") != "success":
              print("⚠️  OBS trigger step did not complete and wrote no summary — "
                    "NOT advancing versions.json (all updates will be retried next run).")
              sys.exit(0)

          old     = load_flat("versions.json")
          new     = load_flat("versions_new.json")
          summary = load_json("trigger_summary.json")

          failed_pkgs = {p["package"] for p in summary.get("failed_list", [])}
          if failed_pkgs:
              print(f"⚠️  {len(failed_pkgs)} package(s) failed triggering — "
                    f"held back for retry: {', '.join(sorted(failed_pkgs))}")

          merged = dict(old)
          added = changed = skipped = 0
          for pkg, ver in new.items():
              if not ver or ver.strip().lower() == "null":
                  skipped += 1
                  continue
              if pkg in failed_pkgs:
                  skipped += 1
                  continue
              if pkg not in old:
                  added += 1
              elif old[pkg] != ver:
                  changed += 1
              merged[pkg] = ver

          with open("versions.json", "w") as f:
              json.dump(merged, f, indent=2, sort_keys=True)
              f.write("\n")

          print(f"Merged {len(new)} entries: {changed} updated, "
                f"{added} newly tracked, {skipped} held back.")
          EOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json

          if git diff --staged --quiet; then
            echo "versions.json is unchanged — skipping commit."
            exit 0
          fi

          # Commit FIRST, then rebase.
          git commit -m "chore: update known package versions [skip ci]"

          # Show anything else that is dirty. Scratch files that are tracked
          # in the repo (e.g. versions_new.json, rewritten by nvchecker) make
          # a plain `git pull --rebase` refuse with "You have unstaged
          # changes". --autostash sets them aside for the rebase and puts
          # them back afterwards (they are still needed for the artifact
          # upload). Long-term fix: `git rm --cached versions_new.json` and
          # add it to .gitignore.
          echo "── other modified files (should be empty) ──"
          git status --short
          echo "────────────────────────────────────────────"

          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✅ Pushed updated versions.json"
              exit 0
            fi
            echo "⚠️  Push attempt ${attempt} failed — retrying …"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "::error::Could not push versions.json after 3 attempts."
          exit 1

      # ── 14. Remove the token-bearing keyfile ──────────────────────────────
      - name: Remove nvchecker keyfile
        if: always()
        run: rm -f "$KEYFILE"

      # ── 15. Upload debug artifacts ────────────────────────────────────────
      # The keyfile is deliberately NOT in this list.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvchecker-run-${{ github.run_number }}
          path: |
            nvchecker_output.jsonl
            nvchecker_errors.log
            versions_new.json
            trigger_summary.json
          if-no-files-found: ignore
          retention-days: 14
